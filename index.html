<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão e Consulta - Cursistas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .trilha-1 { background-color: #3b4282; color: #a3e635; border-color: #2e3468; }
        .trilha-2 { background-color: #2e6943; color: #f0abfc; border-color: #224e31; }
        .trilha-3 { background-color: #9d3d75; color: #fde047; border-color: #7b2f5c; }
        .trilha-4 { background-color: #e06d2d; color: #38bdf8; border-color: #b85420; }
        .trilha-5 { background-color: #234e38; color: #38bdf8; border-color: #183727; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Principal com Alternância de Abas -->
    <header class="bg-indigo-700 text-white shadow-md py-4 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-graduation-cap"></i> Painel Integrado de Cursistas
                </h1>
                <p class="text-indigo-200 text-xs mt-0.5">Sincronizado com Google Sheets &bull; Aba Respostas</p>
            </div>
            
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-500">
                <button onclick="mudarAba('respostas')" id="tabBtnRespostas" 
                    class="px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer bg-white text-indigo-900 shadow-sm">
                    <i class="fa-solid fa-book-open mr-1.5"></i> Visualizar Respostas
                </button>
                <button onclick="mudarAba('completa')" id="tabBtnCompleta" 
                    class="px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer text-indigo-200 hover:text-white">
                    <i class="fa-solid fa-table mr-1.5"></i> Consultar Planilha Completa
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- ABA 1: VISUALIZAR RESPOSTAS                -->
    <!-- ========================================== -->
    <div id="viewRespostas" class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-3.5 border-b border-slate-100 bg-slate-50 flex flex-wrap justify-between items-center gap-2">
                <span class="text-xs font-semibold text-slate-600" id="counterInfo">Conectando...</span>
                <div class="relative w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Filtrar cursista ou tutor..." 
                        class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center gap-2 text-xs">
                    <button id="btnPrev" onclick="mudarPagina(-1)" disabled class="px-2.5 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 disabled:opacity-40 cursor-pointer">Anterior</button>
                    <span id="pageInfo" class="font-medium text-slate-600">Pág. 1</span>
                    <button id="btnNext" onclick="mudarPagina(1)" disabled class="px-2.5 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 disabled:opacity-40 cursor-pointer">Próxima</button>
                </div>
            </div>

            <div class="overflow-x-auto flex-grow">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-[11px] uppercase tracking-wider font-semibold border-b border-slate-200">
                            <th class="py-3 px-4">Cursista / Tutor</th>
                            <th class="py-3 px-3 text-left whitespace-nowrap">Respostas Enviadas</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="2" class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-600 mb-2"></i><p>Carregando dados...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col h-fit sticky top-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-indigo-600"></i> Texto da Resposta
                </h2>
                <button id="btnCopiar" onclick="copiarTexto()" class="hidden text-xs px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-medium transition cursor-pointer">
                    <i class="fa-regular fa-copy mr-1"></i> Copiar
                </button>
            </div>
            
            <div id="painelDetalhe" class="text-slate-600 text-sm">
                <div class="text-center py-16 text-slate-400">
                    <i class="fa-regular fa-hand-pointer text-3xl mb-2 block"></i>
                    Clique em uma das trilhas ao lado para ler o texto completo aqui.
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ABA 2: CONSULTAR PLANILHA COMPLETA         -->
    <!-- ========================================== -->
    <div id="viewCompleta" class="max-w-full mx-auto px-6 py-6 flex-grow w-full hidden flex-col">
        
        <!-- Barra de Filtros (Versão Anterior Otimizada) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-4 flex flex-wrap items-center gap-4 justify-between">
            <div class="flex flex-wrap items-center gap-3 flex-grow">
                <div class="relative min-w-[260px] flex-grow md:flex-grow-0">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="filterGlobal" placeholder="Filtrar por qualquer termo..." 
                        class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="relative min-w-[220px]">
                    <select id="filterTutor" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Filtrar por Tutor (Todos)</option>
                    </select>
                </div>
                <button onclick="limparFiltrosTabelaCompleta()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition cursor-pointer">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Limpar Filtros
                </button>
            </div>
            <div class="text-xs font-semibold text-slate-500" id="counterCompleta">
                Carregando registros...
            </div>
        </div>

        <!-- Tabela Espelhada Completa com Pequenos Filtros em Cada Coluna -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-grow">
            <div class="overflow-x-auto max-h-[68vh]">
                <table class="w-full text-left border-collapse" id="tabelaCompletaElemento">
                    <thead id="tabelaCompletaHead" class="bg-slate-100 text-slate-700 text-xs uppercase tracking-wider font-semibold sticky top-0 z-10 shadow-xs">
                        <!-- Cabeçalho oficial com inputs de filtro embutidos -->
                    </thead>
                    <tbody id="tabelaCompletaBody" class="divide-y divide-slate-100 text-xs">
                        <!-- Linhas dinâmicas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script de Integração e Lógica -->
    <script>
        const SHEET_ID = "1lvV1iZXz8Q1u-GzTYkhD28k4cOMaeBCWiu65jdc4_wA";
        const SHEET_GID = "0";

        let todosRegistros = [];
        let registrosFiltrados = [];
        let colunasExatas = ["Cursista", "Tutor", "Resposta Trilha 1", "Resposta Trilha 2", "Resposta Trilha 3", "Resposta Trilha 4", "Resposta Trilha 5"];
        let filtrosColunaAtivos = {};
        let paginaAtual = 1;
        const ITENS_POR_PAGINA = 50;
        let textoAtualSelecionado = "";

        function mudarAba(aba) {
            const btnResp = document.getElementById('tabBtnRespostas');
            const btnComp = document.getElementById('tabBtnCompleta');
            const viewResp = document.getElementById('viewRespostas');
            const viewComp = document.getElementById('viewCompleta');

            if (aba === 'respostas') {
                btnResp.className = "px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer bg-white text-indigo-900 shadow-sm";
                btnComp.className = "px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer text-indigo-200 hover:text-white";
                viewResp.classList.remove('hidden');
                viewComp.classList.add('hidden');
            } else {
                btnComp.className = "px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer bg-white text-indigo-900 shadow-sm";
                btnResp.className = "px-4 py-1.5 rounded-md text-xs font-semibold transition cursor-pointer text-indigo-200 hover:text-white";
                viewComp.classList.remove('hidden');
                viewResp.classList.add('hidden');
                renderizarTabelaCompleta();
            }
        }

        function carregarDadosPlanilha() {
            const oldScript = document.getElementById('gvizScript');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'gvizScript';
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:processarRespostaSheets&gid=${SHEET_GID}`;
            document.body.appendChild(script);
        }

        window.processarRespostaSheets = function(json) {
            if (!json || !json.table || !json.table.rows) return;

            const rows = json.table.rows;

            const colunasTrilhas = [
                { index: 2, nome: "Resposta Trilha 1" },
                { index: 3, nome: "Resposta Trilha 2" },
                { index: 4, nome: "Resposta Trilha 3" },
                { index: 5, nome: "Resposta Trilha 4" },
                { index: 6, nome: "Resposta Trilha 5" }
            ];

            todosRegistros = rows.map((row, idx) => {
                const cells = row.c || [];
                const celulasValores = cells.map(cell => cell && cell.v !== undefined ? String(cell.v) : "");
                
                const cursista = cells[0] && cells[0].v ? String(cells[0].v).trim() : "";
                const tutor = cells[1] && cells[1].v ? String(cells[1].v).trim() : "Não informado";
                
                const trilhas = {};
                let temAlgumaResposta = false;

                colunasTrilhas.forEach(col => {
                    const val = cells[col.index] && cells[col.index].v ? String(cells[col.index].v).trim() : "";
                    if (val && !val.startsWith("#")) {
                        trilhas[col.nome] = val;
                        temAlgumaResposta = true;
                    }
                });

                return { 
                    id: idx, 
                    cursista, 
                    tutor, 
                    trilhas, 
                    temResposta: temAlgumaResposta,
                    celulas: celulasValores,
                    ordemTrilhas: colunasTrilhas.map(c => c.nome) 
                };
            }).filter(item => item.cursista !== "" && item.cursista.toLowerCase() !== "cursista");

            // Mantém apenas quem tem respostas na aba padrão
            todosRegistros = todosRegistros.filter(item => item.temResposta);

            popularFiltroTutores();
            aplicarFiltroRespostas();
        };

        function popularFiltroTutores() {
            const select = document.getElementById('filterTutor');
            const tutoresUnicos = [...new Set(todosRegistros.map(r => r.tutor))].sort();
            select.innerHTML = '<option value="">Filtrar por Tutor (Todos)</option>' + 
                tutoresUnicos.map(t => `<option value="${t}">${t}</option>`).join('');
        }

        // --- ABA 1 LOGICA ---
        function aplicarFiltroRespostas() {
            const termo = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!termo) {
                registrosFiltrados = todosRegistros;
            } else {
                registrosFiltrados = todosRegistros.filter(item =>
                    item.cursista.toLowerCase().includes(termo) ||
                    item.tutor.toLowerCase().includes(termo)
                );
            }
            paginaAtual = 1;
            renderizarTabelaRespostas();
        }

        function renderizarTabelaRespostas() {
            const tbody = document.getElementById('tabelaCorpo');
            const total = registrosFiltrados.length;
            const totalPaginas = Math.max(1, Math.ceil(total / ITENS_POR_PAGINA));

            document.getElementById('counterInfo').innerText = `${total} cursista(s) com respostas`;
            document.getElementById('pageInfo').innerText = `Pág. ${paginaAtual} de ${totalPaginas}`;
            document.getElementById('btnPrev').disabled = paginaAtual <= 1;
            document.getElementById('btnNext').disabled = paginaAtual >= totalPaginas;

            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="2" class="text-center py-10 text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
            const fatia = registrosFiltrados.slice(inicio, inicio + ITENS_POR_PAGINA);

            tbody.innerHTML = fatia.map(item => {
                const botoesTrilhas = item.ordemTrilhas.map((nomeTrilha, index) => {
                    const numTrilha = index + 1;
                    const classeCor = `trilha-${numTrilha}`;
                    const temResposta = Boolean(item.trilhas[nomeTrilha]);

                    if (temResposta) {
                        return `<button onclick="abrirResposta(${item.id}, '${nomeTrilha.replace(/'/g, "\\'")}')"
                            class="px-2 py-1 ${classeCor} rounded text-[11px] font-semibold transition cursor-pointer shadow-xs hover:opacity-100 whitespace-nowrap">
                            Trilha ${numTrilha}
                        </button>`;
                    } else {
                        return `<span class="px-2 py-1 bg-slate-100 text-slate-400 border border-slate-200 rounded text-[11px] cursor-not-allowed select-none opacity-50 whitespace-nowrap">Trilha ${numTrilha}</span>`;
                    }
                }).join('');

                return `
                    <tr class="hover:bg-slate-50/90 transition">
                        <td class="py-3 px-4">
                            <div class="font-semibold text-slate-800 text-xs sm:text-sm">${item.cursista}</div>
                            <div class="text-[11px] text-slate-400 mt-0.5">Tutor(a): ${item.tutor}</div>
                        </td>
                        <td class="py-3 px-3 text-left whitespace-nowrap">
                            <div class="inline-flex flex-nowrap items-center gap-1">${botoesTrilhas}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function mudarPagina(delta) {
            paginaAtual += delta;
            renderizarTabelaRespostas();
        }

        function abrirResposta(id, nomeTrilha) {
            const item = todosRegistros.find(r => r.id === id);
            if (!item) return;
            const texto = item.trilhas[nomeTrilha] || "Sem conteúdo.";
            textoAtualSelecionado = texto;
            document.getElementById('btnCopiar').classList.remove('hidden');

            document.getElementById('painelDetalhe').innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded bg-indigo-100 text-indigo-800">${nomeTrilha}</span>
                        <span class="text-[11px] text-slate-400">Linha #${item.id + 2}</span>
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold text-slate-400 uppercase block">Cursista</span>
                        <p class="text-sm font-bold text-slate-800">${item.cursista}</p>
                    </div>
                    <div>
                        <span class="text-[11px] font-semibold text-slate-400 uppercase block">Tutor(a)</span>
                        <p class="text-xs text-slate-600">${item.tutor}</p>
                    </div>
                    <div class="pt-2 border-t border-slate-100">
                        <span class="text-[11px] font-semibold text-slate-400 uppercase block mb-1.5">Texto Completo</span>
                        <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm leading-relaxed whitespace-pre-line max-h-[60vh] overflow-y-auto">
                            ${escapeHtml(texto)}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ABA 2 LOGICA (PLANILHA COMPLETA COM FILTROS GLOBAIS E PEQUENOS FILTROS POR COLUNA) ---
        function renderizarTabelaCompleta() {
            const thead = document.getElementById('tabelaCompletaHead');
            const tbody = document.getElementById('tabelaCompletaBody');
            
            // Monta cabeçalho com os nomes solicitados e pequenos inputs de filtro logo abaixo de cada nome
            thead.innerHTML = `
                <tr>
                    <th class="py-3 px-3 border-b border-slate-200 bg-slate-100 align-top">#</th>
                    ${colunasExatas.map((colName, index) => `
                        <th class="py-3 px-3 border-b border-slate-200 bg-slate-100 align-top">
                            <div class="font-bold text-slate-700 mb-1.5">${colName}</div>
                            <input type="text" placeholder="Filtrar..." oninput="atualizarFiltroColuna(${index}, this.value)"
                                class="w-full py-1 px-2 bg-white border border-slate-300 rounded text-[11px] font-normal text-slate-800 focus:ring-1 focus:ring-indigo-500 focus:outline-none">
                        </th>
                    `).join('')}
                </tr>
            `;

            const termoGlobal = document.getElementById('filterGlobal').value.toLowerCase().trim();
            const tutorSelecionado = document.getElementById('filterTutor').value;

            const dadosFiltrados = todosRegistros.filter(item => {
                const matchTutor = !tutorSelecionado || item.tutor === tutorSelecionado;
                const matchGlobal = !termoGlobal || item.celulas.some(val => val.toLowerCase().includes(termoGlobal));
                
                // Filtros específicos de cada coluna
                let matchColunas = true;
                for (let colIdx in filtrosColunaAtivos) {
                    const termoCol = filtrosColunaAtivos[colIdx];
                    const valorCelula = (item.celulas[colIdx] || "").toLowerCase();
                    if (!valorCelula.includes(termoCol)) {
                        matchColunas = false;
                        break;
                    }
                }

                return matchTutor && matchGlobal && matchColunas;
            });

            document.getElementById('counterCompleta').innerText = `Exibindo ${dadosFiltrados.length} de ${todosRegistros.length} registros`;

            if (dadosFiltrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${colunasExatas.length + 1}" class="text-center py-10 text-slate-400">Nenhum registro encontrado com estes filtros.</td></tr>`;
                return;
            }

            tbody.innerHTML = dadosFiltrados.map((item, index) => {
                const tds = item.celulas.map(val => `<td class="py-2.5 px-3 border-b border-slate-100 max-w-xs truncate" title="${escapeHtml(val)}">${escapeHtml(val)}</td>`).join('');
                return `<tr class="hover:bg-slate-50"><td class="py-2.5 px-3 border-b border-slate-100 font-mono text-slate-400 text-[11px]">${index + 1}</td>${tds}</tr>`;
            }).join('');
        }

        function atualizarFiltroColuna(colIndex, valor) {
            if (valor.trim() === "") {
                delete filtrosColunaAtivos[colIndex];
            } else {
                filtrosColunaAtivos[colIndex] = valor.toLowerCase().trim();
            }
            renderizarTabelaCompleta();
        }

        function limparFiltrosTabelaCompleta() {
            document.getElementById('filterGlobal').value = '';
            document.getElementById('filterTutor').value = '';
            filtrosColunaAtivos = {};
            renderizarTabelaCompleta();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function copiarTexto() {
            if (!textoAtualSelecionado) return;
            navigator.clipboard.writeText(textoAtualSelecionado);
            const btn = document.getElementById('btnCopiar');
            btn.innerHTML = '<i class="fa-solid fa-check text-emerald-600 mr-1"></i> Copiado!';
            setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i> Copiar'; }, 2000);
        }

        document.getElementById('searchInput').addEventListener('input', aplicarFiltroRespostas);
        document.getElementById('filterGlobal').addEventListener('input', renderizarTabelaCompleta);
        document.getElementById('filterTutor').addEventListener('change', renderizarTabelaCompleta);

        carregarDadosPlanilha();
    </script>
</body>
</html>
